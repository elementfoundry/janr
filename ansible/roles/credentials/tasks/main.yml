# -------------------------------------------------
# Ensure systemd encrypted credential store exists
# -------------------------------------------------

- name: Ensure systemd encrypted credential base exists
  file:
    path: /etc/credstore.encrypted
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Ensure JANR credential namespace exists
  file:
    path: /etc/credstore.encrypted/janr
    state: directory
    owner: root
    group: root
    mode: "0700"

# -------------------------------------------------
# Create temporary plaintext ONLY for encryption
# Stored in tmpfs-backed /run
# -------------------------------------------------

- name: Create temporary ThreatFox secret
  copy:
    dest: /run/threatfox.secret
    content: "{{ janr_threatfox_api_key }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true

# -------------------------------------------------
# Encrypt into systemd credstore
# -------------------------------------------------

- name: Encrypt ThreatFox credential
  command: >
    systemd-creds encrypt
    /run/threatfox.secret
    /etc/credstore.encrypted/janr/threatfox
  args:
    creates: /etc/credstore.encrypted/janr/threatfox
  no_log: true

# -------------------------------------------------
# Remove plaintext immediately
# -------------------------------------------------

- name: Remove temporary secret file
  file:
    path: /run/threatfox.secret
    state: absent