# -------------------------------------------------
# Ensure systemd encrypted credential store exists
# -------------------------------------------------

- name: Ensure systemd encrypted credential directory exists
  file:
    path: /etc/credstore.encrypted
    state: directory
    owner: root
    group: root
    mode: "0700"

# -------------------------------------------------
# Write temporary plaintext ONLY for encryption
# (deleted immediately after)
# -------------------------------------------------

- name: Create temporary ThreatFox secret
  copy:
    dest: /tmp/threatfox.secret
    content: "{{ janr_threatfox_api_key }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true

# -------------------------------------------------
# Encrypt into systemd credstore
# -------------------------------------------------

- name: Encrypt ThreatFox credential
  command: >
    systemd-creds encrypt
    /tmp/threatfox.secret
    /etc/credstore.encrypted/threatfox
  args:
    creates: /etc/credstore.encrypted/threatfox
  no_log: true

# -------------------------------------------------
# Remove plaintext immediately
# -------------------------------------------------

- name: Remove temporary secret file
  file:
    path: /tmp/threatfox.secret
    state: absent