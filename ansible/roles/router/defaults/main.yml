# -----------------------------
# Base system
# -----------------------------
unused_services:
  - wpa_supplicant
  - hostapd
  - systemd-resolved
  - dnsmasq

router_packages:
  - systemd
  - iproute2
  - nftables
  - dnsutils
  - curl
  - wget
  - vim
  - tcpdump
  - bridge-utils
  - ethtool
  - rfkill
  - hostapd
  - iw
  - wireless-tools
  - dnsmasq
  - iperf3
  - traceroute
  - iputils-ping
  - htop
  - kmod
  - conntrack
  - unbound
  - unbound-anchor

# -----------------------------
# Global
# -----------------------------
country_code: US
wan_interface: enx00e04c681aa4

trusted_subnets:
  - ip: 10.10.0.0
    cidr: 24
    name: ap_lan

  - ip: 192.168.0.0
    cidr: 24
    name: upstream_lan

bridge:
  name: br0
  ip: 10.10.0.1
  cidr: 24

dhcp:
  start: 10.10.0.100
  end: 10.10.0.150
  lease_time: 12h
  gateway: 10.10.0.1
  server: 10.10.0.1

network_endpoints:
  - name: five_g
    type: wifi_ap
    enabled: true
    interface: wlan0
    bridge: br0
    ssid: JANR-5G
    password: 1joshua1
    channel: 149
    band: 5g
    template_override: null
    hide_ssid: false

  - name: two_g
    type: wifi_ap
    enabled: true
    interface: wlx0022f4d9292b
    bridge: br0
    ssid: JANR-2G
    password: 1joshua1
    channel: 1
    band: 2g
    template_override: null
    hide_ssid: false

unbound:
  username: unbound
  directory: /etc/unbound

  interfaces:
    - ip: 127.0.0.1
    - ip: 10.10.0.1
    - ip: ::1

  access_controls:
    - ip: 127.0.0.0
      cidr: 8
    - ip: 10.10.0.0
      cidr: 24
    - ip: ::1
      cidr: 128

  port: 53

  root_hints: /var/lib/unbound/root.hints
  root_key: /var/lib/unbound/root.key

  cache:
    min_ttl: 300
    max_ttl: 86400

static_ips:
  - short_name: minion
    mac_addr: 94:e7:0b:50:68:01
    ip_addr: 10.10.0.13
    domain_name: minon.home.arpa

  - short_name: u3d
    mac_addr: 34:c9:3d:61:fa:4e
    ip_addr: 10.10.0.10
    domain_name: u3d.home.arpa

  - short_name: k1se
    mac_addr: fc:ee:28:0a:33:d5
    ip_addr: 10.10.0.20
    domain_name: k1se.home.arpa