# JANR Router Stack (Armbian / networkd / hostapd / nftables)

# =========================================================
# 1. FIRMWARE POLICY (ARMBIAN-ONLY STACK)
# =========================================================
- name: Ensure Armbian firmware is installed (authoritative source)
  apt:
    name: armbian-firmware
    state: present
    update_cache: yes


# =========================================================
# 2. BLOCK DEBIAN FIRMWARE PACKAGES
# =========================================================
# TODO: Move to templates
- name: Prevent Debian firmware packages from being installed
  copy:
    dest: /etc/apt/preferences.d/99-block-debian-firmware
    content: |
      Package: firmware-linux
      Pin: release *
      Pin-Priority: -1

      Package: firmware-linux-nonfree
      Pin: release *
      Pin-Priority: -1

      Package: firmware-misc-nonfree
      Pin: release *
      Pin-Priority: -1

- name: Remove conflicting Debian firmware packages (if present)
  apt:
    name:
      - firmware-linux
      - firmware-linux-nonfree
      - firmware-misc-nonfree
    state: absent
    purge: yes
  ignore_errors: yes

- name: Hold Armbian firmware package
  dpkg_selections:
    name: armbian-firmware
    selection: hold


# =========================================================
# 3. BASE PACKAGES
# =========================================================
- name: Ensure router base packages are installed
  apt:
    name: "{{ router_packages }}"
    state: present
    update_cache: yes


# =========================================================
# 4. FIX CAPABILITIES (PING)
# =========================================================
- name: Ensure ping has cap_net_raw capability
  command: setcap cap_net_raw+ep /usr/bin/ping
  changed_when: false

# =========================================================
# 5. Deploy /etc/tmpfiles.d
# =========================================================
- name: Deploy /etc/tmpfiles.d
  template:
    src: tmp/janr.conf.j2
    dest: /etc/tmpfiles.d/janr.conf

- name: Apply JANR systemd tmpfiles
  command: systemd-tmpfiles --create /etc/tmpfiles.d/janr.conf
  changed_when: false

# =========================================================
# 5. NETWORK CONFIGURATION
# =========================================================

- name: Deploy bridge netdev
  template:
    src: network/bridge/br0.netdev.j2
    dest: /etc/systemd/network/00-janr-bridge-br0.netdev

- name: Deploy bridge network
  template:
    src: network/bridge/br0.network.j2
    dest: /etc/systemd/network/00-janr-bridge-br0.network

- name: Deploy WAN network config
  template:
    src: network/wan/uplink.network.j2
    dest: "/etc/systemd/network/10-janr-wan-{{ wan_interface }}.network"

- name: Deploy systemd-networkd config per endpoint
  template:
    src: >-
      {{
        item.template_override_network
        | default(
            'network/endpoints/' ~ item.type ~ '.network.j2',
            true
          )
      }}
    dest: "/etc/systemd/network/20-janr-{{ item.name }}-{{ item.interface }}.network"
  loop: "{{ network_endpoints }}"
  when: item.enabled

# =========================================================
# 6. NETPLAN CLEANUP
# =========================================================
- name: Check if Netplan config exists
  stat:
    path: /etc/netplan/10-dhcp-all-interfaces.yaml
  register: netplan_file

- name: Backup Netplan config if it exists
  copy:
    src: /etc/netplan/10-dhcp-all-interfaces.yaml
    dest: /etc/netplan/10-dhcp-all-interfaces.yaml.orig
    remote_src: true
  when: netplan_file.stat.exists

- name: Remove Netplan config if it exists
  file:
    path: /etc/netplan/10-dhcp-all-interfaces.yaml
    state: absent
  when: netplan_file.stat.exists


# =========================================================
# 7. DNS (UNBOUND)
# =========================================================
- name: Create unbound runtime directory
  file:
    path: /var/lib/unbound
    state: directory
    owner: unbound
    group: unbound
    mode: "0755"

- name: Download root hints
  get_url:
    url: https://www.internic.net/domain/named.cache
    dest: /var/lib/unbound/root.hints
    mode: "0644"

- name: Deploy unbound config
  template:
    src: dns/janr-unbound.conf.j2
    dest: /etc/unbound/unbound.conf.d/janr-unbound.conf

- name: Deploy unbound static ips
  template:
    src: network/static/janr-unbound-static.j2
    dest: /etc/unbound/unbound.conf.d/janr-unbound-static.conf


# =========================================================
# 8. SYSCTL
# =========================================================
- name: Deploy sysctl router config
  template:
    src: system/sysctl-router.conf.j2
    dest: /etc/sysctl.d/99-router.conf


# =========================================================
# 9. DNSMASQ (DHCP)
# =========================================================
- name: Deploy dnsmasq config
  template:
    src: dns/janr-dnsmasq.conf.j2
    dest: /etc/dnsmasq.d/janr-dnsmasq.conf

- name: Deploy dnsmasq static ips
  template: 
    src: network/static/janr-dnsmasq-static-ip.j2
    dest: /etc/dnsmasq.d/janr-dnsmasq-static.conf



# =========================================================
# 10. HOSTAPD
# =========================================================
# - name: Deploy hostapd config (5G)
#   template:
#     src: ap/janr-hostapd.conf.j2
#     dest: /etc/hostapd/janr-hostapd.conf

# new architecture - deploy per-endpoint configs
- name: Deploy hostapd config per wifi_ap endpoint
  template:
    src: >-
      {{
        item.template_override
        | default(
            'network_endpoints/wifi_ap/default-' ~ item.band ~ '.conf.j2',
            true
          )
      }}
    dest: "/etc/hostapd/janr-{{ item.name }}-{{ item.interface }}.conf"
  loop: "{{ network_endpoints }}"
  when:
    - item.enabled
    - item.type == "wifi_ap"

# =========================================================
# 11. FIREWALL
# =========================================================
- name: Deploy nftables config
  template:
    src: firewall/nftables.conf.j2
    dest: /etc/nftables.conf
    mode: "0644"


# =========================================================
# 12. RESOLV.CONF
# =========================================================
- name: Remove resolv.conf symlink if present
  file:
    path: /etc/resolv.conf
    state: absent

# TODO: Move to templates
- name: Set static resolver to unbound
  copy:
    dest: /etc/resolv.conf
    content: |
      nameserver 127.0.0.1
      options edns0


# =========================================================
# 13. SERVICES
# =========================================================
- name: Deploy hostapd service
  template:
    src: services/janr-hostapd@.service.j2
    dest: /etc/systemd/system/janr-hostapd@.service

- name: Deploy unbound service
  template:
    src: services/janr-unbound.service.j2
    dest: /etc/systemd/system/janr-unbound.service

- name: Deploy dnsmasq service
  template:
    src: services/janr-dnsmasq.service.j2
    dest: /etc/systemd/system/janr-dnsmasq.service


# =========================================================
# 14. LOGGING
# =========================================================
- name: Ensure persistent log directory exists
  file:
    path: /var/log/janr
    state: directory
    mode: "0755"

- name: Symlink firewall log
  file:
    src: /run/janr/log/firewall.log
    dest: /var/log/janr/firewall.log
    state: link
    force: true


# =========================================================
# 15. CONNTRACK SERVICE
# =========================================================
- name: Deploy JANR conntrack service
  template:
    src: services/janr-conntrack.service.j2
    dest: /etc/systemd/system/janr-conntrack.service

# =========================================================
# 16. LOG ROTATION
# =========================================================
# TODO: Move to templates
- name: Configure logrotate
  copy:
    dest: /etc/logrotate.d/janr-conntrack
    mode: "0644"
    content: |
      /run/janr/log/firewall.log {
          size 10M
          rotate 2
          missingok
          notifempty
          copytruncate
          compress
      }


# =========================================================
# 17. SYSTEM APPLY
# =========================================================
- name: Apply sysctl changes
  command: sysctl --system

- name: Reload systemd daemon
  systemd:
    daemon_reload: yes

- name: Enable systemd-networkd-wait-online
  systemd:
    name: systemd-networkd-wait-online.service
    enabled: yes

- name: Mask stock dnsmasq service
  systemd:
    name: dnsmasq
    enabled: no
    masked: yes
    state: stopped


# =========================================================
# 18. NETWORK CORE STARTUP
# =========================================================
- name: Enable and restart systemd-networkd
  systemd:
    name: systemd-networkd
    enabled: yes
    state: restarted

- name: Restart nftables
  systemd:
    name: nftables
    enabled: yes
    state: restarted


# =========================================================
# 19. DNSSEC TRUST ANCHOR
# =========================================================
- name: Check if root key exists
  stat:
    path: /var/lib/unbound/root.key
  register: rootkey_before

- name: Attempt DNSSEC trust anchor generation
  command: unbound-anchor -a /var/lib/unbound/root.key
  when: not rootkey_before.stat.exists
  ignore_errors: true

- name: Re-check if root key exists
  stat:
    path: /var/lib/unbound/root.key
  register: rootkey_after
  when: not rootkey_before.stat.exists

- name: Fail if root key was not created
  fail:
    msg: >
      unbound-anchor did not create /var/lib/unbound/root.key.
      DNSSEC bootstrap failed.
  when:
    - not rootkey_before.stat.exists
    - not rootkey_after.stat.exists


# =========================================================
# 20. VALIDATE UNBOUND CONFIG
# =========================================================
- name: Validate unbound configuration
  command: unbound-checkconf


# =========================================================
# 21. START DNS STACK
# =========================================================
- name: Start unbound
  systemd:
    name: janr-unbound
    enabled: true
    state: restarted

- name: Start dnsmasq
  systemd:
    name: janr-dnsmasq
    enabled: true
    state: restarted


# =========================================================
# 22. START LOGGING
# =========================================================
- name: Start conntrack
  systemd:
    name: janr-conntrack.service
    enabled: true
    state: started


# =========================================================
# 23. AP START LAST
# =========================================================
- name: Enable hostapd service per wifi_ap endpoint
  systemd:
    name: "janr-hostapd@janr-{{ item.name }}-{{ item.interface }}"
    enabled: true
    state: started
    daemon_reload: true
  loop: "{{ network_endpoints }}"
  when:
    - item.enabled
    - item.type == "wifi_ap"