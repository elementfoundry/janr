# -------------------------------------------------
# BASE PACKAGES
# -------------------------------------------------
- name: Ensure blocklist base packages are installed
  apt:
    name: "{{ blocklist_packages }}"
    state: present
    update_cache: yes

# -------------------------------------------------
# SETUP LOGGING
# -------------------------------------------------

- name: Configure JANR blocklist log rotation
  copy:
    dest: /etc/logrotate.d/janr-blocklist
    content: |
      /run/janr/log/blocklist.log {
          size 10M
          rotate 3
          missingok
          notifempty
          copytruncate
      }

- name: Symlink blocklist log
  file:
    src: /run/janr/log/blocklist.log
    dest: /var/log/janr/blocklist.log
    state: link
    force: true

# -------------------------------------------------
# ENSURE BASE DIRECTORY EXISTS
# -------------------------------------------------

- name: Ensure JANR blocklist base directory exists
  file:
    path: /opt/janr/blocklist
    state: directory
    mode: "0755"
    owner: root
    group: janr-admin

# -------------------------------------------------
# PRESERVED STATE DIRECTORIES (never wiped)
# -------------------------------------------------

- name: Ensure JANR blocklist runtime directories exist
  file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
    owner: root
    group: janr-admin
  loop:
    - /opt/janr/blocklist/downloads
    - /opt/janr/blocklist/rpz

# -------------------------------------------------
# WIPE CODE AREA (plugin + engine layer)
# -------------------------------------------------

- name: Wipe plugin system directory
  file:
    path: /opt/janr/blocklist/plugins
    state: absent

- name: Wipe core directory
  file:
    path: /opt/janr/blocklist/core
    state: absent

- name: Wipe deployment engine
  file:
    path: /opt/janr/blocklist/janr_blocklist_deployment.py
    state: absent

- name: Wipe generated blocklist config
  file:
    path: /opt/janr/blocklist/janr_blocklists.py
    state: absent

# -------------------------------------------------
# RECREATE PLUGIN STRUCTURE
# -------------------------------------------------

- name: Recreate plugin base directory
  file:
    path: /opt/janr/blocklist/plugins
    state: directory
    mode: "0755"
    owner: root
    group: janr-admin

- name: Recreate core base directory
  file:
    path: /opt/janr/blocklist/core
    state: directory
    mode: "0755"
    owner: root
    group: janr-admin

# -------------------------------------------------
# PLUGIN SYSTEM DEPLOYMENT
# -------------------------------------------------

- name: Deploy plugin system (feeds, datasets, parsers )
  copy:
    src: src/plugins/
    dest: /opt/janr/blocklist/plugins/
    mode: preserve
    owner: root
    group: janr-admin

- name: Deploy core
  copy:
    src: src/core/
    dest: /opt/janr/blocklist/core/
    mode: preserve
    owner: root
    group: janr-admin

# -------------------------------------------------
# BLOCKLIST ENGINE
# -------------------------------------------------

- name: Deploy blocklist deployment engine
  copy:
    src: src/janr_blocklist_deployment.py
    dest: /opt/janr/blocklist/janr_blocklist_deployment.py
    mode: "0755"
    owner: root
    group: janr-admin

- name: Deploy JANR blocklist config (generated python file)
  template:
    src: janr_blocklists.py.j2
    dest: /opt/janr/blocklist/janr_blocklists.py
    mode: "0665"
    owner: root
    group: janr-admin

# -------------------------------------------------
# SYSTEMD
# -------------------------------------------------

- name: Deploy systemd service for blocklist deployment
  template:
    src: janr-blocklists.service.j2
    dest: /etc/systemd/system/janr-blocklists.service
    mode: "0644"

- name: Deploy systemd timer for blocklist updates
  template:
    src: janr-blocklists.timer.j2
    dest: /etc/systemd/system/janr-blocklists.timer
    mode: "0644"

- name: Reload systemd daemon
  systemd:
    daemon_reload: true

- name: Enable and start JANR blocklist timer
  systemd:
    name: janr-blocklists.timer
    enabled: true
    state: started

- name: Run initial blocklist deployment immediately
  systemd:
    name: janr-blocklists.service
    state: started
