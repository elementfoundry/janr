- name: Create janr-admin group
  group:
    name: janr-admin
    state: present

- name: Create admin user
  user:
    name: "{{ janr_admin_username }}"
    password: "{{ janr_admin_password }}"
    groups:
      - janr-admin
    append: true
    shell: /bin/bash
    create_home: true
    state: present
    update_password: on_create

- name: Allow janr-admin to manage JANR services
  ansible.builtin.copy:
    dest: /etc/sudoers.d/janr-admin
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s
    content: |
      Cmnd_Alias JANR_SERVICES = \
          /bin/systemctl start janr*, \
          /bin/systemctl stop janr*, \
          /bin/systemctl restart janr*, \
          /bin/systemctl reload janr*, \
          /bin/systemctl status janr*

      %janr-admin ALL=(root) NOPASSWD: JANR_SERVICES
