# -----------------------------
# Base system
# -----------------------------
unused_services:
  - wpa_supplicant
  - hostapd
  - systemd-resolved
  - dnsmasq

router_packages:
  - systemd
  - iproute2
  - nftables
  - dnsutils
  - curl
  - wget
  - vim
  - tcpdump
  - bridge-utils
  - ethtool
  - rfkill
  - hostapd
  - iw
  - wireless-tools
  - dnsmasq
  - iperf3
  - traceroute
  - iputils-ping
  - htop
  - kmod
  - conntrack
  - unbound
  - unbound-anchor

# -----------------------------
# Global
# -----------------------------
country_code: US
wan_interface: enx00e04c681aa4

trusted_subnets:
  - ip: 10.10.0.0
    cidr: 24
    name: ap_lan

  - ip: 192.168.0.0
    cidr: 24
    name: upstream_lan

bridge:
  name: br0

dhcp:
  start: 10.10.0.100
  end: 10.10.0.150
  lease_time: 12h
  gateway: 10.10.0.1
  server: 10.10.0.1
   
access_points:
  - name: five_g
    description: 5 GHz AP (ACTIVE)
    enabled: true
    interface: wlan0
    ip: 10.10.0.1
    cidr: 24
    ssid: JANR-5G
    password: 1joshua1
    channel: 149
    band: 5GHz

  - name: two_g
    description: 2.4 GHz AP (FUTURE - unused)
    enabled: false
    interface: wlx0022f4d9292b
    ip: 10.10.0.2
    cidr: 24
    ssid: JANR-2G
    password: 1joshua1
    channel: 1
    band: 2.4GHz

unbound:
  username: unbound
  directory: /etc/unbound

  interfaces:
    - ip: 127.0.0.1
    - ip: 10.10.0.1
    - ip: ::1

  access_controls:
    - ip: 127.0.0.0
      cidr: 8
    - ip: 10.10.0.0
      cidr: 24
    - ip: ::1
      cidr: 128

  port: 53

  root_hints: /var/lib/unbound/root.hints
  root_key: /var/lib/unbound/root.key

  cache:
    min_ttl: 300
    max_ttl: 86400
